name: Temporary Pages state inspection

on:
  push:
    branches: ["diag/pages-state-inspection-20261113"]

permissions:
  contents: read
  pages: read
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read actual Pages configuration and active deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PAGES_SITE_CONFIG"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{url, status, build_type, source, cname, html_url, https_enforced, public}'
          echo "LATEST_PAGES_BUILD"
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '{url, status, error, commit, duration, created_at, updated_at}'
          echo "RECENT_DEPLOYMENTS"
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" --jq '.[] | [.id, .sha, .environment, .created_at, .updated_at, .task, .ref] | @tsv'
          for id in 7751850744 7751848330 7751773483 7751770400 7749687109 7749683468; do
            echo "DEPLOYMENT_STATUSES $id"
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=10" --jq '.[] | [.id, .state, .created_at, .updated_at, .environment_url, .log_url, .description] | @tsv' || true
          done
      - name: Compare normal and cache-revalidation requests
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, urllib.parse, uuid
          base = "https://jeiky224.github.io/cloud/auth.js"
          variants = [
            ("normal", base, {}),
            ("versioned", base + "?v=20261113-2", {}),
            ("fresh_query", base + "?diagnostic=" + uuid.uuid4().hex, {}),
            ("no_cache", base + "?diagnostic=" + uuid.uuid4().hex,
             {"Cache-Control":"no-cache, no-store, max-age=0", "Pragma":"no-cache"}),
          ]
          for label, url, extra in variants:
              headers = {"User-Agent":"Wayward-Pages-State-Inspector/2.0"}
              headers.update(extra)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  print("LIVE_JS", label, "status", response.status,
                        "bytes", len(body), "sha256", hashlib.sha256(body).hexdigest(),
                        "last-modified", response.headers.get("Last-Modified"),
                        "cache-control", response.headers.get("Cache-Control"),
                        "age", response.headers.get("Age"),
                        "x-cache", response.headers.get("X-Cache"),
                        "etag", response.headers.get("ETag"),
                        "nativeWebView", b"nativeWebViewTransportRequested" in body,
                        "nativeHandler", b"nativeHost.onmessage = handleNativeHostMessage" in body,
                        "legacyError", "Wayward 게임 창을 찾을 수 없습니다".encode() in body)
          PY
